name: Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Test (Monorepo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            nodemailer/package-lock.json

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install & Lint Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Install & Check Backend
        run: |
          cd backend
          npm ci || npm install
          npm run build

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test

      - name: Install Nodemailer Service
        run: |
          cd nodemailer
          npm ci || npm install

